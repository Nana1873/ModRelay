name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test ModRelay.sln -c Release
      - shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $package = "artifacts/package/ModRelay"
          dotnet publish src/ModRelay.App/ModRelay.App.csproj -c Release -r win-x64 --self-contained true -o $package -p:Version=$version -p:RepositoryUrl=https://github.com/${{ github.repository }}

          @(
            "ModRelay $version"
            ""
            "Extract the ModRelay folder to a writable location and run ModRelay.exe."
            "Enable Penumbra's HTTP API under Settings -> Advanced, then select the folders to watch."
            ""
            "Documentation and releases: https://github.com/${{ github.repository }}"
            "License information: LICENSES.txt"
          ) | Set-Content "$package/README.txt" -Encoding utf8

          $separator = "=" * 80
          @(
            $separator
            "MODRELAY LICENSE"
            $separator
            (Get-Content LICENSE -Raw)
            $separator
            "SHARPCOMPRESS LICENSE AND THIRD-PARTY NOTICES"
            $separator
            (Get-Content THIRD-PARTY-NOTICES.md -Raw)
            $separator
            "MICROSOFT .NET LICENSE"
            $separator
            (Get-Content "$env:ProgramFiles/dotnet/LICENSE.txt" -Raw)
            $separator
            "MICROSOFT .NET THIRD-PARTY NOTICES"
            $separator
            (Get-Content "$env:ProgramFiles/dotnet/ThirdPartyNotices.txt" -Raw)
          ) -join "`r`n`r`n" | Set-Content "$package/LICENSES.txt" -Encoding utf8

          $expectedFiles = @("LICENSES.txt", "ModRelay.exe", "README.txt")
          $actualFiles = @(Get-ChildItem $package -File | Sort-Object Name | Select-Object -ExpandProperty Name)
          if (Compare-Object $expectedFiles $actualFiles) {
            throw "Unexpected release package contents: $($actualFiles -join ', ')"
          }

          Compress-Archive -Path $package -DestinationPath artifacts/ModRelay-win-x64.zip
          (Get-FileHash artifacts/ModRelay-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content artifacts/ModRelay-win-x64.zip.sha256
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/ModRelay-win-x64.zip `
            artifacts/ModRelay-win-x64.zip.sha256 `
            --title "ModRelay ${{ github.ref_name }}" `
            --generate-notes
