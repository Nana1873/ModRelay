name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test ModRelay.sln -c Release
      - shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $package = "artifacts/package/ModRelay"
          dotnet publish src/ModRelay.App/ModRelay.App.csproj -c Release -r win-x64 --self-contained true -o $package -p:Version=$version -p:RepositoryUrl=https://github.com/${{ github.repository }}
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md $package/
          Copy-Item "$env:ProgramFiles/dotnet/LICENSE.txt" "$package/DOTNET-LICENSE.txt"
          Copy-Item "$env:ProgramFiles/dotnet/ThirdPartyNotices.txt" "$package/DOTNET-THIRD-PARTY-NOTICES.txt"
          Compress-Archive -Path $package -DestinationPath artifacts/ModRelay-win-x64.zip
          (Get-FileHash artifacts/ModRelay-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content artifacts/ModRelay-win-x64.zip.sha256
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/ModRelay-win-x64.zip `
            artifacts/ModRelay-win-x64.zip.sha256 `
            --title "ModRelay ${{ github.ref_name }}" `
            --generate-notes
