name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore ModRelay.sln
      - run: dotnet build ModRelay.sln -c Release --no-restore
      - run: dotnet test ModRelay.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - run: dotnet publish src/ModRelay.App/ModRelay.App.csproj -c Release -r win-x64 --self-contained true --no-restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
